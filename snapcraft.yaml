name: favirecon
summary: Use favicons to improve your target recon phase
description: |
      Use favicons to improve your target recon phase. 
      Quickly detect technologies, WAF, exposed panels, known services.
version: 1.1.0
grade: stable
base: core24

confinement: strict

apps:
  favirecon:
    command: bin/favirecon
    plugs:
      - home
      - network

parts:
  favirecon:
    plugin: go
    build-snaps:
      - go/latest/stable
    source-type: git
    source: https://github.com/edoardottt/favirecon
